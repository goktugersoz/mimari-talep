<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fabrika Portal Girişi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
</head>

<body>
  <div class="wrap" id="fabrikaContainer">
    <header>
      <div>
        <p class="brand-eyebrow" style="color: var(--accent-dark);">FABRİKA PORTALİ · GİRİŞ YAPAN: <span id="lblCurrentFabrikaUser" style="font-weight:700;">—</span></p>
        <h1>Fabrika Sipariş & Onay Paneli</h1>
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <button id="btnFabrikaGoToYonetim" class="btn-cancel-edit hidden"
          style="padding:6px 12px; font-size:12px; height:auto; background:#3498db; color:#fff; border-color:#3498db;">YÖNETİCİ PORTALİ</button>
        <button id="btnFabrikaGoToBoard" class="btn-cancel-edit hidden"
          style="padding:6px 12px; font-size:12px; height:auto; background:#2ecc71; color:#fff; border-color:#2ecc71;">PROJE PANOSU</button>
        <button id="btnFabrikaLogout" class="btn-cancel-edit"
          style="padding:6px 12px; font-size:12px; height:auto; background:var(--danger); color:#fff; border-color:var(--danger);">ÇIKIŞ YAP</button>
      </div>
    </header>

    <div class="storage-warning hidden" id="fabrikaStorageWarning">
      🟢 Supabase veritabanı aktif ve bağlandı.
    </div>

    <!-- MAIN ORDERS VIEW -->
    <div class="panel">
      <h3 style="font-family:'Montserrat',sans-serif; margin-bottom:15px; border-bottom: 2px solid var(--line); padding-bottom: 8px;">Yönetimden Gelen Excel Sipariş Listeleri</h3>
      <div class="table-responsive" style="overflow-x:auto;">
        <table class="drafts-table" style="width: 100%; border-collapse: collapse; min-width: 900px;">
          <thead>
            <tr style="background: var(--paper); border-bottom: 2px solid var(--line); text-align: left;">
              <th style="padding: 12px 10px;">Tarih</th>
              <th style="padding: 12px 10px;">CRM Kodu / Başlık / Açıklama</th>
              <th style="padding: 12px 10px;">Yüklenen Fotoğraf</th>
              <th style="padding: 12px 10px; width: 140px;">Durum</th>
              <th style="padding: 12px 10px; text-align: center; width: 320px;">İşlemler</th>
            </tr>
          </thead>
          <tbody id="tblFabrikaOrdersBody">
            <!-- JS populated -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- MODAL FOR PHOTO UPLOAD -->
    <div id="uploadPhotoModal" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:none; align-items:center; justify-content:center; z-index:9999;">
      <div class="titleblock" style="width: 450px; background:#fff; border-radius:8px; padding:20px; box-shadow:0 5px 15px rgba(0,0,0,0.3);">
        <div class="tb-top" style="margin-bottom:15px;"><span id="uploadModalTitle">FOTOĞRAF YÜKLE & ONAYA GÖNDER</span></div>
        <input type="hidden" id="uploadOrderId">
        <div class="tb-grid" style="grid-template-columns: 1fr; gap:15px; margin-bottom:15px;">
          <div class="cell">
            <label style="font-family:'Montserrat',sans-serif; font-weight:600; margin-bottom:5px;">Fotoğraf Dosyası (PNG, JPG - Maks 10MB)</label>
            <input type="file" id="inpFabrikaPhotoFile" accept="image/*" style="font-size:13px; width:100%;">
          </div>
          <div class="cell">
            <label style="font-family:'Montserrat',sans-serif; font-weight:600; margin-bottom:5px;">Notlar (Opsiyonel)</label>
            <textarea id="inpFabrikaNotes" placeholder="Yönetime iletmek istediğiniz notlar..." style="width:100%; height:80px; padding:8px; border:1px solid var(--line); border-radius:4px; font-family:'Roboto',sans-serif;"></textarea>
          </div>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:10px;">
          <button type="button" class="bg-gray-500 hover:bg-gray-600 text-white font-bold px-4 py-2 rounded text-sm" onclick="closeUploadModal()">Kapat</button>
          <button type="button" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-2 rounded text-sm" id="btnSubmitFabrikaPhoto">Onaya Gönder</button>
        </div>
      </div>
    </div>

  </div>

  <div class="toast" id="toast"></div>

  <script src="fabrika.js"></script>
</body>

</html>
